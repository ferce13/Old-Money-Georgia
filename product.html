<!DOCTYPE html>
<html lang="en">
<head>
<title>Old Money Georgia</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0806">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Libre+Franklin:wght@300&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #0a0806;
  --bg-elevated: #0f0d0a;
  --bg-card: #121010;
  --text: #e8dfc8;
  --text-muted: #9a8e75;
  --text-dim: rgba(154,142,117,0.4);
  --gold: #d4af37;
  --gold-dark: #b8960c;
  --gold-glow: rgba(212,175,55,0.08);
  --gold-border: rgba(212,175,55,0.12);
  --gold-border-hover: rgba(212,175,55,0.35);
  --font-display: 'Cinzel', serif;
  --font-body: 'Cormorant Garamond', serif;
  --font-ui: 'Libre Franklin', sans-serif;
  --ease-luxury: cubic-bezier(0.22, 1, 0.36, 1);
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
::selection { background: rgba(212,175,55,0.3); color: var(--text); }

body {
  background: var(--bg);
  font-family: var(--font-body);
  color: var(--text);
  overflow-x: hidden;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
  -webkit-font-smoothing: antialiased;
}

#pageFade {
  position: fixed; inset: 0;
  background: var(--bg);
  z-index: 99999;
  pointer-events: none;
  opacity: 1;
  transition: opacity 0.8s var(--ease-luxury);
}

/* ═══ PARTICLES ═══ */
.particles-container {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}
.particle {
  position: absolute;
  width: 3px; height: 3px;
  background: var(--gold);
  border-radius: 50%;
  opacity: 0;
  animation: particleFloat linear infinite;
}
@keyframes particleFloat {
  0% { opacity: 0; transform: translateY(100vh) scale(0); }
  10% { opacity: 0.4; }
  90% { opacity: 0.1; }
  100% { opacity: 0; transform: translateY(-10vh) scale(1); }
}

/* ═══ CORNER ORNAMENTS ═══ */
.corner {
  position: fixed;
  width: 60px; height: 60px;
  opacity: 0.25;
  z-index: 100;
  pointer-events: none;
}
.corner svg { width: 100%; height: 100%; }
.tl { top: 20px; left: 20px; }
.tr { top: 20px; right: 20px; transform: scaleX(-1); }
.bl { bottom: 20px; left: 20px; transform: scaleY(-1); }
.br { bottom: 20px; right: 20px; transform: scale(-1); }

/* ═══ HEADER ═══ */
.product-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 10002;
  padding: calc(18px + env(safe-area-inset-top)) 24px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: linear-gradient(180deg, rgba(10,8,6,0.95) 0%, rgba(10,8,6,0.7) 70%, transparent 100%);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.product-header-logo {
  font-family: var(--font-display);
  font-size: 11px;
  letter-spacing: 0.3em;
  color: var(--gold);
  text-decoration: none;
  text-transform: uppercase;
}

.product-cart-btn {
  width: 44px; height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  transition: color 0.3s;
  -webkit-tap-highlight-color: transparent;
  position: relative;
}

.product-cart-btn:active { color: var(--gold); }

.cart-count {
  position: absolute;
  top: 6px; right: 4px;
  width: 18px; height: 18px;
  background: var(--gold);
  color: var(--bg);
  font-family: var(--font-display);
  font-size: 9px;
  border-radius: 50%;
  display: none;
  align-items: center;
  justify-content: center;
}

.cart-count.visible { display: flex; }

/* ═══ BURGER MENU ═══ */
.om-burger {
  width: 44px; height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  background: none;
  border: none;
  -webkit-tap-highlight-color: transparent;
}

.om-burger-inner {
  width: 24px; height: 14px;
  position: relative;
}

.om-burger-line {
  position: absolute;
  left: 0;
  height: 1px;
  background: var(--gold);
  transition: all 0.5s var(--ease-luxury);
  transform-origin: center;
}

.om-burger-line:nth-child(1) { top: 0; width: 100%; }
.om-burger-line:nth-child(2) { top: 50%; width: 55%; }
.om-burger-line:nth-child(3) { top: 100%; width: 75%; }

.om-burger.active .om-burger-line:nth-child(1) { top: 50%; transform: rotate(45deg); }
.om-burger.active .om-burger-line:nth-child(2) { opacity: 0; transform: translateX(-12px); }
.om-burger.active .om-burger-line:nth-child(3) { top: 50%; width: 100%; transform: rotate(-45deg); }

/* ═══ FULLSCREEN NAV ═══ */
.om-nav-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,8,6,0.97);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  z-index: 10001;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.6s var(--ease-luxury), visibility 0s linear 0.6s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.om-nav-overlay.open {
  opacity: 1;
  visibility: visible;
  transition: opacity 0.6s var(--ease-luxury), visibility 0s linear 0s;
}

.om-nav-overlay::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  transition: width 0.8s var(--ease-luxury) 0.15s;
}

.om-nav-overlay.open::before { width: 70%; }

.om-nav-overlay::after {
  content: '';
  position: absolute;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(212,175,55,0.3), transparent);
  transition: width 0.8s var(--ease-luxury) 0.3s;
}

.om-nav-overlay.open::after { width: 40%; }

.om-nav-content { text-align: center; position: relative; }

.om-nav-brand {
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 0.5em;
  color: rgba(212,175,55,0.3);
  text-transform: uppercase;
  margin-bottom: 48px;
  opacity: 0;
  transform: translateY(-12px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.om-nav-overlay.open .om-nav-brand {
  opacity: 1;
  transform: translateY(0);
  transition-delay: 0.2s;
}

.om-nav-items { list-style: none; padding: 0; margin: 0; }
.om-nav-item { margin: 0; padding: 0; overflow: hidden; }

.om-nav-link {
  display: block;
  font-family: var(--font-body);
  font-size: clamp(26px, 5.5vw, 40px);
  font-weight: 300;
  font-style: italic;
  color: rgba(232,223,200,0.7);
  text-decoration: none;
  letter-spacing: 0.05em;
  padding: 13px 30px;
  position: relative;
  opacity: 0;
  transform: translateY(35px);
  transition: opacity 0.5s ease, transform 0.5s var(--ease-luxury), color 0.35s ease;
  -webkit-tap-highlight-color: transparent;
}

.om-nav-overlay.open .om-nav-link {
  opacity: 1;
  transform: translateY(0);
}

.om-nav-item:nth-child(1) .om-nav-link { transition-delay: 0.18s; }
.om-nav-item:nth-child(2) .om-nav-link { transition-delay: 0.25s; }
.om-nav-item:nth-child(3) .om-nav-link { transition-delay: 0.32s; }
.om-nav-item:nth-child(4) .om-nav-link { transition-delay: 0.39s; }
.om-nav-item:nth-child(5) .om-nav-link { transition-delay: 0.46s; }
.om-nav-item:nth-child(6) .om-nav-link { transition-delay: 0.53s; }

.om-nav-overlay:not(.open) .om-nav-item:nth-child(1) .om-nav-link { transition-delay: 0.22s; }
.om-nav-overlay:not(.open) .om-nav-item:nth-child(2) .om-nav-link { transition-delay: 0.18s; }
.om-nav-overlay:not(.open) .om-nav-item:nth-child(3) .om-nav-link { transition-delay: 0.14s; }
.om-nav-overlay:not(.open) .om-nav-item:nth-child(4) .om-nav-link { transition-delay: 0.10s; }
.om-nav-overlay:not(.open) .om-nav-item:nth-child(5) .om-nav-link { transition-delay: 0.06s; }
.om-nav-overlay:not(.open) .om-nav-item:nth-child(6) .om-nav-link { transition-delay: 0.02s; }

.om-nav-link::after {
  content: '';
  position: absolute;
  bottom: 7px; left: 50%;
  transform: translateX(-50%);
  width: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  transition: width 0.5s var(--ease-luxury);
}

.om-nav-link:active { color: var(--gold); }
.om-nav-link:active::after { width: 45%; }

.om-nav-link-sub {
  display: block;
  font-family: var(--font-display);
  font-size: 8px;
  font-style: normal;
  letter-spacing: 0.35em;
  color: rgba(154,142,117,0.28);
  text-transform: uppercase;
  margin-top: 2px;
}

.om-nav-footer {
  position: absolute;
  bottom: 38px;
  left: 0; right: 0;
  text-align: center;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}

.om-nav-overlay.open .om-nav-footer {
  opacity: 1;
  transform: translateY(0);
  transition-delay: 0.58s;
}

.om-nav-footer-text {
  font-family: var(--font-display);
  font-size: 8px;
  letter-spacing: 0.4em;
  color: rgba(154,142,117,0.2);
  text-transform: uppercase;
}

.om-nav-socials {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 14px;
}

.om-nav-social {
  color: rgba(154,142,117,0.25);
  transition: color 0.3s;
  -webkit-tap-highlight-color: transparent;
}

.om-nav-social:active { color: var(--gold); }

/* ═══ PRODUCT LAYOUT ═══ */
.product-page {
  padding-top: calc(80px + env(safe-area-inset-top));
}

@media (min-width: 768px) {
  .product-page {
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 100vh;
  }
}

/* ═══ IMAGE GALLERY ═══ */
.product-gallery {
  position: relative;
  overflow: hidden;
  background: var(--bg-card);
}

.product-gallery-scroll {
  display: flex;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}

.product-gallery-scroll::-webkit-scrollbar { display: none; }

.product-gallery-slide {
  min-width: 100%;
  aspect-ratio: 3/4;
  scroll-snap-align: start;
  overflow: hidden;
}

.product-gallery-slide img {
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.6s ease;
}

.product-gallery-slide img.loaded { opacity: 1; }

.product-gallery-dots {
  position: absolute;
  bottom: 20px; left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
}

.product-gallery-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: rgba(232,223,200,0.2);
  transition: all 0.4s ease;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  border: none;
  padding: 0;
}

.product-gallery-dot.active {
  background: var(--gold);
  width: 20px;
  border-radius: 3px;
}

/* ═══ PRODUCT INFO ═══ */
.product-info {
  padding: 40px 28px calc(140px + env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
}

@media (min-width: 768px) {
  .product-info {
    padding: 60px 48px 60px;
    justify-content: center;
    max-width: 560px;
  }
}

.product-badge {
  font-family: var(--font-display);
  font-size: 8px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--bg);
  background: var(--gold);
  padding: 5px 12px;
  display: inline-block;
  margin-bottom: 20px;
  align-self: flex-start;
}

.product-name {
  font-family: var(--font-body);
  font-size: clamp(28px, 6vw, 38px);
  font-weight: 300;
  font-style: italic;
  color: var(--text);
  letter-spacing: 0.03em;
  line-height: 1.25;
  margin-bottom: 12px;
}

.product-price {
  font-family: var(--font-display);
  font-size: 14px;
  letter-spacing: 0.2em;
  color: var(--text-muted);
  margin-bottom: 28px;
}

.product-price-toggle {
  font-family: var(--font-body);
  font-size: 12px;
  font-style: italic;
  color: var(--text-dim);
  margin-left: 8px;
  cursor: pointer;
  text-decoration: underline;
  text-underline-offset: 2px;
  background: none;
  border: none;
  -webkit-tap-highlight-color: transparent;
}

.product-divider {
  width: 40px; height: 1px;
  background: linear-gradient(90deg, var(--gold), transparent);
  opacity: 0.3;
  margin-bottom: 24px;
}

.product-description {
  font-size: 17px;
  font-style: italic;
  font-weight: 300;
  color: rgba(232,223,200,0.65);
  line-height: 1.8;
  margin-bottom: 28px;
}

.product-details-label {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--gold-dark);
  margin-bottom: 12px;
}

.product-details-text {
  font-size: 14px;
  font-weight: 300;
  color: var(--text-muted);
  line-height: 1.8;
  margin-bottom: 36px;
}

.size-label {
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 14px;
}

.size-options {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 32px;
}

.size-btn {
  min-width: 48px;
  padding: 12px 16px;
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 0.15em;
  text-align: center;
  color: var(--text-dim);
  background: none;
  border: 1px solid var(--gold-border);
  cursor: pointer;
  transition: all 0.3s ease;
  -webkit-tap-highlight-color: transparent;
}

.size-btn.active {
  color: var(--gold);
  border-color: var(--gold);
  background: var(--gold-glow);
}

.size-btn:active {
  border-color: var(--gold-border-hover);
}

/* ═══ ADD TO CART ═══ */
.add-to-cart-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  padding: 20px 28px calc(20px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, transparent 0%, rgba(10,8,6,0.95) 30%, var(--bg) 100%);
  z-index: 100;
}

@media (min-width: 768px) {
  .add-to-cart-bar {
    position: relative;
    background: none;
    padding: 0;
    margin-top: 8px;
  }
}

.add-to-cart-btn {
  width: 100%;
  font-family: var(--font-display);
  font-size: 10px;
  letter-spacing: 0.3em;
  text-transform: uppercase;
  color: var(--bg);
  background: linear-gradient(135deg, #b8960c, #d4af37, #b8960c);
  border: none;
  padding: 18px;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  transition: opacity 0.3s;
}

.add-to-cart-btn::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: shimmer 3s ease-in-out infinite;
}

@keyframes shimmer {
  0% { left: -100%; }
  50% { left: 100%; }
  100% { left: 100%; }
}

.add-to-cart-btn:active { opacity: 0.85; }

.add-to-cart-btn.added {
  background: none;
  border: 1px solid var(--gold);
  color: var(--gold);
}

.add-to-cart-btn.added::after { display: none; }

/* ═══ TOUCH RING ═══ */
.touch-ring {
  position: fixed;
  pointer-events: none;
  width: 0; height: 0;
  border: 1px solid rgba(212,175,55,0.6);
  border-radius: 50%;
  transform: translate(-50%, -50%);
  animation: ringExpand 0.8s ease-out forwards;
  z-index: 9998;
}
@keyframes ringExpand {
  0% { width: 0; height: 0; opacity: 0.8; }
  100% { width: 80px; height: 80px; opacity: 0; }
}

@media (hover: hover) {
  .om-nav-link:hover { color: var(--gold); }
  .om-nav-link:hover::after { width: 45%; }
  .om-nav-social:hover { color: var(--gold); }
  .size-btn:hover { border-color: var(--gold-border-hover); color: var(--text-muted); }
}

body.locked { overflow: hidden; position: fixed; width: 100%; }
/* ═══ BACK BUTTON ═══ */
.product-back-btn {
  position: fixed;
  top: calc(78px + env(safe-area-inset-top));
  left: 20px;
  display: inline-flex;
  align-items: center;
  gap: 12px;
  font-family: var(--font-display);
  font-size: 9px;
  letter-spacing: 0.35em;
  color: rgba(232,223,200,0.55);
  text-decoration: none;
  text-transform: uppercase;
  padding: 10px 16px 10px 14px;
  background: rgba(10,8,6,0.55);
  border: 1px solid rgba(212,175,55,0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  z-index: 50;
  -webkit-tap-highlight-color: transparent;
  transition: color 0.4s var(--ease-luxury), border-color 0.4s var(--ease-luxury), background 0.4s var(--ease-luxury);
  opacity: 0;
  transform: translateX(-8px);
  animation: backFadeIn 0.8s var(--ease-luxury) 0.5s forwards;
}

@keyframes backFadeIn {
  to { opacity: 1; transform: translateX(0); }
}

.product-back-btn::before,
.product-back-btn::after {
  content: '';
  position: absolute;
  width: 7px; height: 7px;
  opacity: 0.5;
  transition: opacity 0.4s var(--ease-luxury);
}
.product-back-btn::before {
  top: -1px; left: -1px;
  border-top: 1px solid var(--gold);
  border-left: 1px solid var(--gold);
}
.product-back-btn::after {
  bottom: -1px; right: -1px;
  border-bottom: 1px solid var(--gold);
  border-right: 1px solid var(--gold);
}

.product-back-btn svg {
  transition: transform 0.5s var(--ease-luxury);
}

.product-back-btn:active,
.product-back-btn:hover {
  color: var(--gold);
  border-color: rgba(212,175,55,0.4);
  background: rgba(10,8,6,0.75);
}
.product-back-btn:active svg,
.product-back-btn:hover svg {
  transform: translateX(-4px);
}
.product-back-btn:active::before,
.product-back-btn:active::after,
.product-back-btn:hover::before,
.product-back-btn:hover::after {
  opacity: 1;
}

</style>
</head>

<body>

<div id="pageFade"></div>

<!-- Ambient Canvas -->
<canvas id="meshCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;"></canvas>

<!-- Particles -->
<div class="particles-container" id="particles"></div>

<!-- Corner Ornaments -->
<div class="corner tl"><svg viewBox="0 0 60 60" fill="none"><path d="M1 59V1H59" stroke="#d4af37" stroke-width="0.5"/></svg></div>
<div class="corner tr"><svg viewBox="0 0 60 60" fill="none"><path d="M1 59V1H59" stroke="#d4af37" stroke-width="0.5"/></svg></div>
<div class="corner bl"><svg viewBox="0 0 60 60" fill="none"><path d="M1 59V1H59" stroke="#d4af37" stroke-width="0.5"/></svg></div>
<div class="corner br"><svg viewBox="0 0 60 60" fill="none"><path d="M1 59V1H59" stroke="#d4af37" stroke-width="0.5"/></svg></div>

<!-- ═══ HEADER ═══ -->
<header class="product-header">
  <button class="om-burger" id="omBurger" aria-label="Menu">
    <div class="om-burger-inner">
      <span class="om-burger-line"></span>
      <span class="om-burger-line"></span>
      <span class="om-burger-line"></span>
    </div>
  </button>
  <a href="index.html" class="product-header-logo">OM</a>
  <button class="product-cart-btn" id="productCartBtn" aria-label="Cart">

<script>
// ═══ PAGE FADE ═══
window.addEventListener('load', function() {
  setTimeout(function() { document.getElementById('pageFade').style.opacity = '0'; }, 100);
});
window.addEventListener('pageshow', function(e) {
  if (e.persisted) {
    document.getElementById('pageFade').style.opacity = '0';
  }
});

document.addEventListener('click', function(e) {
  var link = e.target.closest('a');
  if (!link) return;
  var href = link.getAttribute('href');
  if (!href || href.startsWith('http') || href.startsWith('mailto') || href.startsWith('#') || link.getAttribute('target') === '_blank') return;
  e.preventDefault();
  document.getElementById('pageFade').style.opacity = '1';
  setTimeout(function() { window.location.href = href; }, 600);
});

document.addEventListener('touchstart', function(e) {
  var r = document.createElement('div');
  r.className = 'touch-ring';
  r.style.left = e.touches[0].clientX + 'px';
  r.style.top = e.touches[0].clientY + 'px';
  document.body.appendChild(r);
  setTimeout(function() { r.remove(); }, 800);
});
</script>

<script>
// ═══ AMBIENT CANVAS ═══
(function() {
  var canvas = document.getElementById('meshCanvas');
  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var w, h;

  function resize() {
    w = canvas.offsetWidth; h = canvas.offsetHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  var blobs = [];
  for (var i = 0; i < 5; i++) {
    blobs.push({
      x: 0.1 + Math.random() * 0.8, y: 0.1 + Math.random() * 0.8,
      vx: (Math.random() - 0.5) * 0.0004, vy: (Math.random() - 0.5) * 0.0004,
      radius: 0.3 + Math.random() * 0.25,
      opacity: 0.025 + Math.random() * 0.025,
      phase: Math.random() * Math.PI * 2,
      pulseSpeed: 0.002 + Math.random() * 0.003
    });
  }

  var animId;
  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      b.phase += b.pulseSpeed;
      b.x += b.vx + Math.sin(b.phase * 0.7) * 0.00015;
      b.y += b.vy + Math.cos(b.phase * 0.5) * 0.00015;
      if (b.x < -0.15 || b.x > 1.15) b.vx *= -1;
      if (b.y < -0.15 || b.y > 1.15) b.vy *= -1;
      var cx = b.x * w, cy = b.y * h, r = b.radius * Math.max(w, h);
      var pulse = 0.65 + 0.35 * Math.sin(b.phase);
      var op = b.opacity * pulse;
      var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, 'rgba(212,175,55,' + op + ')');
      grad.addColorStop(0.35, 'rgba(200,165,40,' + (op * 0.55) + ')');
      grad.addColorStop(0.65, 'rgba(184,150,12,' + (op * 0.2) + ')');
      grad.addColorStop(1, 'rgba(184,150,12,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);
    }
    animId = requestAnimationFrame(draw);
  }

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) cancelAnimationFrame(animId);
    else draw();
  });

  resize(); draw();
  window.addEventListener('resize', resize);
})();
</script>

<script>
// ═══ NAVIGATION MENU ═══
(function() {
  var burger = document.getElementById('omBurger');
  var overlay = document.getElementById('omNavOverlay');
  var isOpen = false;

  function openMenu() {
    isOpen = true;
    burger.classList.add('active');
    overlay.classList.add('open');
    document.body.classList.add('locked');
  }

  function closeMenu(cb) {
    isOpen = false;
    burger.classList.remove('active');
    overlay.classList.remove('open');
    document.body.classList.remove('locked');
    if (cb) setTimeout(cb, 650);
  }

  burger.addEventListener('click', function() {
    if (!isOpen) openMenu(); else closeMenu();
  });

  var navLinks = overlay.querySelectorAll('.om-nav-link:not([target="_blank"])');
  navLinks.forEach(function(link) {
    link.addEventListener('click', function(e) {
      var href = this.getAttribute('href');
      if (href.startsWith('#')) return;
      e.preventDefault();
      var fade = document.getElementById('pageFade');
      closeMenu(function() {
        if (fade) fade.style.opacity = '1';
        setTimeout(function() { window.location.href = href; }, 600);
      });
    });
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && isOpen) closeMenu();
  });
})();
</script>

<script>
// ═══ PRODUCT PAGE LOGIC ═══
(function() {
  var currency = sessionStorage.getItem('omCurrency') || 'gel';
  var selectedSize = null;
  var product = null;

  var params = new URLSearchParams(window.location.search);
  var productId = params.get('id');

  var cached = sessionStorage.getItem('omProduct');
  if (cached) {
    product = JSON.parse(cached);
    if (product.id !== productId) product = null;
  }

  function init(p) {
    product = p;
    document.title = p.name + ' | Old Money Georgia';
    renderGallery();
    renderInfo();
    updateCartCount();
  }

  if (product) {
    init(product);
  } else {
    var xhr = new XMLHttpRequest();
    xhr.open('GET', 'products.json', true);
    xhr.onload = function() {
      if (xhr.status === 200) {
        var products = JSON.parse(xhr.responseText);
        var found = products.find(function(p) { return p.id === productId; });
        if (found) init(found);
        else window.location.href = 'shop.html';
      }
    };
    xhr.send();
  }

  function formatPrice(p) {
    if (currency === 'usd') return '$' + p.price_usd;
    return '₾' + p.price_gel;
  }

  function altPrice(p) {
    if (currency === 'usd') return '₾' + p.price_gel;
    return '$' + p.price_usd;
  }

  function renderGallery() {
    var scroll = document.getElementById('galleryScroll');
    var dots = document.getElementById('galleryDots');
    scroll.innerHTML = '';
    dots.innerHTML = '';

    product.images.forEach(function(src, i) {
      var slide = document.createElement('div');
      slide.className = 'product-gallery-slide';
      slide.innerHTML = '<img src="' + src + '" alt="' + product.name + '" loading="lazy" onload="this.classList.add(\'loaded\')">';
      scroll.appendChild(slide);

      var dot = document.createElement('button');
      dot.className = 'product-gallery-dot' + (i === 0 ? ' active' : '');
      dot.setAttribute('aria-label', 'Image ' + (i + 1));
      dot.addEventListener('click', function() {
        scroll.scrollTo({ left: scroll.offsetWidth * i, behavior: 'smooth' });
      });
      dots.appendChild(dot);
    });

    scroll.addEventListener('scroll', function() {
      var idx = Math.round(scroll.scrollLeft / scroll.offsetWidth);
      dots.querySelectorAll('.product-gallery-dot').forEach(function(d, j) {
        d.classList.toggle('active', j === idx);
      });
    });
  }

  function renderInfo() {
    var info = document.getElementById('productInfo');
    var html = '';

    if (product.badge) {
      html += '<span class="product-badge">' + product.badge + '</span>';
    }

    html += '<h1 class="product-name">' + product.name + '</h1>';
    html += '<p class="product-price">' + formatPrice(product) +
      '<button class="product-price-toggle" id="priceToggle">' + altPrice(product) + '</button></p>';
    html += '<div class="product-divider"></div>';
    html += '<p class="product-description">' + product.description + '</p>';
    html += '<p class="product-details-label">Details</p>';
    html += '<p class="product-details-text">' + product.details + '</p>';
    html += '<p class="size-label">Size</p>';
    html += '<div class="size-options" id="sizeOptions">';
    product.sizes.forEach(function(size) {
      html += '<button class="size-btn" data-size="' + size + '">' + size + '</button>';
    });
    html += '</div>';

    info.innerHTML = html;

    var sizeBtns = document.querySelectorAll('.size-btn');
    var addBtn = document.getElementById('addToCartBtn');

    sizeBtns.forEach(function(btn) {
      btn.addEventListener('click', function() {
        sizeBtns.forEach(function(b) { b.classList.remove('active'); });
        this.classList.add('active');
        selectedSize = this.dataset.size;
        addBtn.disabled = false;
        addBtn.textContent = 'Add to Cart';
        addBtn.classList.remove('added');
      });
    });

    document.getElementById('priceToggle').addEventListener('click', function() {
      currency = currency === 'gel' ? 'usd' : 'gel';
      sessionStorage.setItem('omCurrency', currency);
      renderInfo();
    });
  }

  document.getElementById('addToCartBtn').addEventListener('click', function() {
    if (!selectedSize || !product) return;
    var btn = this;

    var cart = JSON.parse(sessionStorage.getItem('omCart') || '[]');
    var existing = cart.find(function(item) {
      return item.id === product.id && item.size === selectedSize;
    });

    if (existing) {
      existing.qty++;
    } else {
      cart.push({
        id: product.id,
        name: product.name,
        price_gel: product.price_gel,
        price_usd: product.price_usd,
        size: selectedSize,
        image: product.images[0],
        qty: 1
      });
    }

    sessionStorage.setItem('omCart', JSON.stringify(cart));
    updateCartCount();

    btn.classList.add('added');
    btn.textContent = 'Added to Cart ✓';
    setTimeout(function() {
      btn.classList.remove('added');
      btn.textContent = 'Add to Cart';
    }, 2000);
  });

  function updateCartCount() {
    var cart = JSON.parse(sessionStorage.getItem('omCart') || '[]');
    var total = cart.reduce(function(sum, item) { return sum + item.qty; }, 0);
    var el = document.getElementById('cartCount');
    el.textContent = total;
    el.classList.toggle('visible', total > 0);
  }

  document.getElementById('productCartBtn').addEventListener('click', function() {
    sessionStorage.setItem('omOpenCart', 'true');
    document.getElementById('pageFade').style.opacity = '1';
    setTimeout(function() { window.location.href = 'shop.html'; }, 600);
  });
})();
</script>
